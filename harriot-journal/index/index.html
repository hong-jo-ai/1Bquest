<style>
.jr, .jr *, .jr *::before, .jr *::after { box-sizing: border-box; }
.jr h1, .jr h2, .jr h3, .jr p, .jr ul, .jr li, .jr figure { margin: 0; padding: 0; }
.jr img { display: block; width: 100%; height: auto; }
.jr li { list-style: none; }

.jr {
  --ink:  #111111;
  --mute: #8e8e8e;
  --rule: #ebebeb;

  background: #fff;
  color: var(--ink);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont,
               'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  min-height: 100svh; display: flex; flex-direction: column;
}

.jr__wide { max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); width: 100%; }

/* ── 상단 바 ───────────────────────────────────────────────────────────── */
.jr__bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px clamp(20px, 4vw, 48px);
}
.jr__brand { display: block; width: 116px; }
.jr__nav { display: flex; gap: 26px; }
.jr__nav a {
  font-size: 12px; font-weight: 500; letter-spacing: .06em;
  color: var(--mute); text-decoration: none;
}
.jr__nav a:hover { color: var(--ink); }

/* ── 마스트헤드 ────────────────────────────────────────────────────────── */
.jr__mast { padding: clamp(28px, 4vw, 52px) 0 clamp(32px, 4vw, 56px); }
.jr__mastTitle { font-size: 12px; font-weight: 700; letter-spacing: .26em;
                 text-transform: uppercase; color: var(--mute); }
.jr__mastDek { margin-top: 10px; font-size: 15px; color: var(--mute);
               line-height: 1.7; word-break: keep-all; }

/* ── 리드 : 왼쪽 헤드라인 / 오른쪽 사진 ────────────────────────────────── */
.jr__lead { padding-bottom: clamp(56px, 8vw, 104px); }
.jr__leadLink {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr);
  gap: clamp(28px, 5vw, 72px); align-items: center;
  text-decoration: none; color: inherit;
}
.jr__leadTitle {
  font-size: clamp(30px, 4.2vw, 52px); font-weight: 700;
  line-height: 1.24; letter-spacing: -.035em; word-break: keep-all;
}
.jr__leadDek {
  margin-top: 20px; font-size: 16px; line-height: 1.8; color: #4a4a4a;
  word-break: keep-all; max-width: 44ch;
}
.jr__leadFig { overflow: hidden; aspect-ratio: 4 / 3; background: #f4f4f4; }
.jr__leadFig img { width: 100%; height: 100%; object-fit: cover;
                   transition: transform .55s cubic-bezier(.2,.6,.2,1); }
.jr__leadLink:hover .jr__leadFig img { transform: scale(1.03); }
.jr__leadLink:hover .jr__leadTitle { text-decoration: underline; text-underline-offset: 6px; }

/* ── 그리드 ────────────────────────────────────────────────────────────── */
.jr__grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: clamp(36px, 4vw, 56px) clamp(20px, 2.6vw, 34px);
}
.jr__card a { display: block; text-decoration: none; color: inherit; }
.jr__cardFig { overflow: hidden; aspect-ratio: 16 / 10; background: #f4f4f4; }
.jr__cardFig img { width: 100%; height: 100%; object-fit: cover;
                   transition: transform .55s cubic-bezier(.2,.6,.2,1); }
.jr__card a:hover .jr__cardFig img { transform: scale(1.03); }
.jr__h {
  font-size: clamp(19px, 1.7vw, 22px); font-weight: 700; line-height: 1.34;
  letter-spacing: -.03em; margin-top: 18px; word-break: keep-all;
}
.jr__card a:hover .jr__h { text-decoration: underline; text-underline-offset: 5px; }

/* 메타 : 시계 아이콘 + 분량 */
.jr__meta {
  margin-top: 12px; display: flex; align-items: center; gap: 7px;
  font-size: 13px; color: var(--mute);
}
.jr__meta svg { flex: none; width: 13px; height: 13px; stroke: currentColor;
                fill: none; stroke-width: 1.6; }
.jr__leadLink .jr__meta { margin-top: 22px; }

/* ── 아카이브 ──────────────────────────────────────────────────────────── */
.jr__archive { padding: clamp(64px, 8vw, 112px) 0 clamp(48px, 6vw, 80px); margin-top: auto; }
.jr__archive h2 {
  font-size: 12px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase;
  color: var(--mute); padding-bottom: 16px;
}
.jr__archive a {
  display: flex; align-items: baseline; gap: 16px;
  padding: 18px 0; border-top: 1px solid var(--rule);
  font-size: 16px; font-weight: 500; line-height: 1.55;
  color: var(--ink); text-decoration: none; word-break: keep-all;
}
.jr__archive li:last-child a { border-bottom: 1px solid var(--rule); }
.jr__archive a:hover { color: var(--mute); }
.jr__archiveNote { margin-top: 20px; font-size: 13px; color: var(--mute); line-height: 1.75; }

/* ── 푸터 ──────────────────────────────────────────────────────────────── */
.jr__foot { border-top: 1px solid var(--rule); padding: 32px clamp(20px, 4vw, 48px) 64px; }
.jr__footInner {
  max-width: 1240px; margin: 0 auto;

}
.jr__footNav { display: flex; gap: 26px; flex-wrap: wrap; }
.jr__footNav a { font-size: 12px; font-weight: 500; letter-spacing: .06em;

.jr__footNav a:hover { color: var(--ink); }
.jr__footNote { font-size: 12px; color: var(--mute); }

@media (max-width: 900px) {
  .jr__leadLink { grid-template-columns: 1fr; gap: 24px; }
  .jr__leadFig { order: -1; aspect-ratio: 16 / 10; }
  .jr__grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) { .jr__grid { grid-template-columns: 1fr; } }

<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  var CLOCK = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  function meta(p) {
    return '<div class="jr__meta">' + CLOCK +
           '<span>' + (p.mins ? esc(p.mins) + '분 분량' : '') + '</span></div>';
  }

  var lead = POSTS.filter(function (p) { return p.lead; })[0];
  var rest = POSTS.filter(function (p) { return p !== lead; });

  var leadSlot = document.querySelector("[data-lead]");
  if (leadSlot && lead) {
    leadSlot.className = "jr__lead";
    leadSlot.innerHTML =
      '<a class="jr__leadLink" href="/journal/' + esc(lead.slug) + '/">' +
        '<div>' +
          '<h2 class="jr__leadTitle">' + esc(lead.title) + '</h2>' +
          '<p class="jr__leadDek">' + esc(lead.dek || "") + '</p>' +
          meta(lead) +
        '</div>' +
        '<figure class="jr__leadFig"><img src="' + esc(lead.image) + '" alt="' +
          esc(lead.alt || "") + '" loading="eager"></figure>' +
      '</a>';
  }

  var grid = document.querySelector("[data-grid]");
  if (grid) {
    if (!rest.length) grid.style.display = "none";
    grid.innerHTML = rest.map(function (p) {
      return '<li class="jr__card">' +
        '<a href="/journal/' + esc(p.slug) + '/">' +
          '<figure class="jr__cardFig"><img src="' + esc(p.image) + '" alt="' +
            esc(p.alt || "") + '" loading="lazy"></figure>' +
          '<h2 class="jr__h">' + esc(p.title) + '</h2>' +
          meta(p) +
        '</a></li>';
    }).join("");
  }

  var arc = document.querySelector("[data-archive]");
  if (arc) {
    arc.innerHTML = ARCHIVE.map(function (a) {
      return '<li><a href="' + esc(a.href) + '">' + esc(a.title) + "</a></li>";
    }).join("");
  }
})();
</script>
